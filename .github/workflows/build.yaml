name: Build curl package
on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  AUTOBUILD_BUILD_ID: ${{ github.run_id }}
  AUTOBUILD_VSVER: "180"
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/.build-variables/variables
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: .build-variables
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install packaging tools
        run: python -m pip install autobuild==3.10.2 llsd zstandard
      - name: Install dependencies (openssl, nghttp2, zlib-ng)
        run: autobuild install -A 64
      - name: Build and smoke test
        shell: bash
        run: autobuild build -A 64
      - name: Package
        run: autobuild package -A 64 --archive-format tzst
      - name: Verify package contents
        shell: bash
        run: |
          archive=$(ls *.tar.zst)
          python -c "import io, sys, tarfile, zstandard; names = tarfile.open(fileobj=io.BytesIO(zstandard.ZstdDecompressor().decompressobj().decompress(open(sys.argv[1], 'rb').read()))).getnames(); missing = [n for n in sys.argv[2:] if n not in names]; sys.exit('missing: %s' % missing if missing else 0)" \
            "$archive" LICENSES/curl.txt autobuild-package.xml include/curl/curl.h \
            $([ "${{ matrix.platform }}" = windows64 ] && echo lib/release/libcurl.lib || echo lib/release/libcurl.a)
          sha256sum "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: curl-${{ matrix.platform }}
          path: '*.tar.zst'
          if-no-files-found: error


  # Linux is built twice. linux64-lts: inside ubuntu:24.04 (glibc 2.39), the
  # oldest glibc any viewer line builds with, against the LTS openssl package
  # committed in autobuild.xml; the check step fails the job on any glibc
  # symbol newer than 2.39 (built on glibc 2.42, curl 8.23 used
  # __memset_explicit_chk). linux64: directly on the runner (ubuntu-latest),
  # against the matching "latest" openssl package. Both jobs share this run's
  # AUTOBUILD_BUILD_ID, so the LTS archive is renamed to
  # ...-linux64-lts-<id>.tar.zst to keep the two names distinct.
  package-linux-lts:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get -y install build-essential cmake ninja-build git python3 python3-venv python3-pip ca-certificates curl zstd perl pkg-config binutils
          python3 -m venv /opt/ab
          /opt/ab/bin/pip install autobuild==3.10.2 llsd zstandard
          echo /opt/ab/bin >> "$GITHUB_PATH"
          ldd --version 2>&1 | sed -n 1p  # sed reads to the end: no SIGPIPE under pipefail
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: .build-variables
      - name: Install dependencies (openssl, nghttp2, zlib-ng)
        shell: bash
        run: autobuild install -A 64
      - name: Build and smoke test
        shell: bash
        run: autobuild build -A 64
      - name: Package
        shell: bash
        run: autobuild package -A 64 --archive-format tzst
      - name: No glibc symbol newer than 2.39
        shell: bash
        run: python3 -I scripts/glibc-check.py --max 2.39 --dep-dir stage/packages/lib/release stage/lib/release/libcurl.a
      - name: Name the archive linux64-lts
        shell: bash
        run: |
          for f in *-linux64-*.tar.zst; do mv "$f" "${f/-linux64-/-linux64-lts-}"; done
          ls -l *.tar.zst
      - name: Verify package contents
        shell: bash
        run: |
          archive=$(ls *.tar.zst)
          python -c "import io, sys, tarfile, zstandard; names = tarfile.open(fileobj=io.BytesIO(zstandard.ZstdDecompressor().decompressobj().decompress(open(sys.argv[1], 'rb').read()))).getnames(); missing = [n for n in sys.argv[2:] if n not in names]; sys.exit('missing: %s' % missing if missing else 0)" \
            "$archive" LICENSES/curl.txt autobuild-package.xml include/curl/curl.h \
            lib/release/libcurl.a
          sha256sum "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: curl-linux64-lts
          path: '*.tar.zst'
          if-no-files-found: error


  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: .build-variables
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install packaging tools
        run: python -m pip install autobuild==3.10.2 llsd zstandard
      - name: Host toolchain
        run: |
          . /etc/os-release; echo "$PRETTY_NAME"
          ldd --version 2>&1 | sed -n 1p
          gcc --version | sed -n 1p
      - name: Use the matching (non-LTS) openssl package
        run: autobuild installables edit openssl platform=linux64 url=https://github.com/anne-skydancer/3p-openssl/releases/download/v3.5.9.2/openssl-3.5.9.2-linux64-42282004860.tar.zst hash=3f24145d422fe2eceacb8e40b4e0f037c87b891f hash_algorithm=sha1
      - name: Install dependencies (openssl, nghttp2, zlib-ng)
        run: autobuild install -A 64
      - name: Build and smoke test
        shell: bash
        run: autobuild build -A 64
      - name: Package
        run: autobuild package -A 64 --archive-format tzst
      - name: Newest glibc the archive needs
        shell: bash
        run: python3 -I scripts/glibc-check.py --dep-dir stage/packages/lib/release stage/lib/release/libcurl.a | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify package contents
        shell: bash
        run: |
          archive=$(ls *.tar.zst)
          python -c "import io, sys, tarfile, zstandard; names = tarfile.open(fileobj=io.BytesIO(zstandard.ZstdDecompressor().decompressobj().decompress(open(sys.argv[1], 'rb').read()))).getnames(); missing = [n for n in sys.argv[2:] if n not in names]; sys.exit('missing: %s' % missing if missing else 0)"             "$archive" LICENSES/curl.txt autobuild-package.xml include/curl/curl.h lib/release/libcurl.a
          sha256sum "$archive" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: curl-linux64
          path: '*.tar.zst'
          if-no-files-found: error


  # Publishes the packages when the owner pushes a tag v<VERSION.txt>.
  release:
    needs: [package, package-linux-lts, package-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION.txt
        run: |
          expected="v$(tr -d '\r\n' < VERSION.txt)"
          [ "${GITHUB_REF_NAME}" = "$expected" ] || { echo "tag ${GITHUB_REF_NAME} != $expected"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tar.zst | tee SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" *.tar.zst SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "curl ${GITHUB_REF_NAME#v}" \
            --notes "libcurl 8.23.0, static, HTTP and HTTPS only, OpenSSL 3.5 + nghttp2 + zlib-ng. Source: curl-8.23.0.tar.gz, SHA-256 e3de77cfa6367083c776a26647fc9f633b538c06c3baa73d931a252ac8f72b49. Commit ${GITHUB_SHA}."
